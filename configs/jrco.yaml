# JR&CO Roofing: client config for Ella.
# Everything client-specific lives here. Prompts, provisioning and tests read it;
# none of them hard-code JR&CO. Validated by configs/schema.json (npm run validate).
# Assumptions are marked "ASSUMPTION" and listed in README > Spec gaps.

client_id: jrco
environment: staging            # staging | live. Provisioning names resources "<agent> (<client_id>, <environment>)"

business:
  name: JR&CO Roofing
  short_name: JR&CO
  spoken_name: "J.R. and Co"    # ASSUMPTION: how TTS should say "JR&CO"; the written name is kept in text and the CRM
  description: a residential and commercial roofing company
  website: null                 # fictional client; none

agent:
  name: Ella
  role: 24/7 inbound voice assistant, lead qualifier and roofing knowledge specialist
  tone: [professional, warm, articulate, confident, reassuring]
  # Spec greeting, with the recording consent line added (spec gap: no consent wording).
  first_message: "Thanks for calling J.R. and Co! My name is Ella. This call may be recorded for quality. How can I help you with your property today?"
  phone:
    number: auto                # "auto": provisioning claims one free Vapi US number
    area_code: "312"            # ASSUMPTION: Chicago, to match the US Central timezone

locale:
  language: en-US
  country: US
  timezone: America/Chicago     # ASSUMPTION: spec gives no location; US Central
  emergency_number: "911"

voice:
  # Through Vapi, so no separate ElevenLabs or Deepgram account is needed.
  provider: vapi
  voice_id: Savannah            # US female (Vapi voice v2); Paige and Hana are retired. Audition on the first call
  voice_version: 2
  transcriber: { provider: deepgram, model: nova-3, language: en }
  model: { provider: openai, model: gpt-4o, temperature: 0.3, max_tokens: 250 }

call:
  answer_on_first_ring: true    # spec: "instantly pick up on the first ring"; Vapi answers as soon as the call connects and Ella speaks first
  silence_timeout_seconds: 30   # ASSUMPTION: spec doesn't cover silence. Ella checks in, then ends the call
  max_duration_seconds: 900     # ASSUMPTION: 15 minutes
  end_call_message: "Thanks for calling J.R. and Co. Take care."

# ASSUMPTION: spec gives no business hours. Typical US roofer hours, local time.
# Format "HH:MM-HH:MM" (24h) or "closed"; "24h" means always open.
hours:
  standard: &standard
    mon: "07:00-18:00"
    tue: "07:00-18:00"
    wed: "07:00-18:00"
    thu: "07:00-18:00"
    fri: "07:00-18:00"
    sat: "08:00-12:00"
    sun: closed
  office: &office
    mon: "08:00-17:00"
    tue: "08:00-17:00"
    wed: "08:00-17:00"
    thu: "08:00-17:00"
    fri: "08:00-17:00"
    sat: closed
    sun: closed
  always: &always
    mon: 24h
    tue: 24h
    wed: 24h
    thu: 24h
    fri: 24h
    sat: 24h
    sun: 24h

# Transfer targets. transfer_to picks how a transfer works:
#   assistant - in-call hand-off to a stand-in Vapi assistant that answers as that team.
#               Used for this build: Vapi's free plan has one number, and free numbers
#               can't dial out, so phone-to-phone transfers aren't possible for free.
#               Also works in the browser, so "Talk to Ella" can demo transfers.
#   "+1..."   - phone transfer to a real number (a real client's setup), with an
#               unanswered-call fallback. Supported by provisioning, not used here.
# transfer_type: warm passes the whole conversation to the team; cold passes nothing.
departments:
  residential_sales:
    name: Residential Sales
    transfer_to: assistant
    transfer_type: warm         # spec: "Cold/Warm"; ASSUMPTION warm
    hours: *standard
    persona: { name: Sam, greeting: "Residential Sales, this is Sam." }
    after_hours_fallback: [calendar_booking, crm_task]
  commercial:
    name: Commercial Division
    transfer_to: assistant
    transfer_type: warm         # ASSUMPTION: spec doesn't say
    hours: *standard
    persona: { name: Dana, greeting: "Commercial Division, this is Dana." }
    after_hours_fallback: [email_high_priority, crm_task]
  on_call:
    name: On-Call Manager
    transfer_to: assistant
    transfer_type: warm
    hours: *always              # ASSUMPTION: "24/7 On-Call Dispatch" in the spec prompt
    persona: { name: Mike, greeting: "On-call, this is Mike." }
    after_hours_fallback: [sms_dispatch, push, crm_task]
  operations:
    name: Operations and Project Management
    transfer_to: assistant
    transfer_type: warm
    hours: *standard
    persona: { name: Priya, greeting: "Operations, this is Priya." }
    after_hours_fallback: [crm_flag, notify_pm]
  finance:
    name: Finance
    transfer_to: assistant
    transfer_type: warm
    hours: *office
    persona: { name: Leo, greeting: "Finance, this is Leo." }
    after_hours_fallback: [crm_billing_queue]

# Routing matrix (spec section 3, plus the gaps we resolved). The system prompt
# and the tools are generated from this list.
intents:
  - id: new_residential
    label: New residential quote or free inspection
    caller_need: New Roof            # or Repair; Ella picks the closer one
    department: residential_sales
    required_fields: [full_name, phone, property_address, property_type]
    in_hours: Collect lead details, then warm transfer to Residential Sales.
    after_hours: Offer a free inspection booking now; if they'd rather not book, capture details for a morning call-back.
  - id: commercial
    label: Commercial project or maintenance
    caller_need: New Roof
    department: commercial
    required_fields: [full_name, phone, company_name, property_address, facility_type, roof_size_or_buildings]
    in_hours: Collect contact and facility details, then warm transfer to the Commercial Division.
    after_hours: Capture details; flag as high priority for the Commercial Division first thing.
  - id: emergency
    label: Emergency roof leak or storm damage
    caller_need: Storm Damage        # or Repair for a non-storm leak
    department: on_call
    emergency: true
    required_fields: [property_address]   # ASSUMPTION: don't hold up an emergency; phone comes from caller ID
    in_hours: Empathy, safety line if there is any danger, get the address, send the emergency alert, then warm transfer to the On-Call Manager.
    after_hours: Same as in hours (24/7). If the transfer isn't answered, the alert has already gone; tell the caller the on-call team will call back shortly.
  - id: existing_customer
    label: Existing customer or project status
    caller_need: Existing Project Status
    department: operations
    required_fields: [full_name, phone, property_address, pm_name]
    in_hours: Explain Ella can't see project status, capture address and PM name, then transfer to Operations.
    after_hours: Capture details; the CRM is flagged with the transcript and the PM is notified for a call-back.
  - id: billing
    label: Customer billing question
    caller_need: Billing
    department: finance
    required_fields: [full_name, phone, invoice_or_account_number]
    in_hours: Collect account or invoice number, then transfer to Finance.
    after_hours: Take a message for the billing queue; Finance calls back next business day.
  - id: supplier_payable
    label: Supplier or accounts payable
    caller_need: Supplier or Accounts Payable
    department: finance
    required_fields: [full_name, phone, company_name, invoice_or_account_number]   # no property address
    in_hours: Collect company name and invoice number, then transfer to Finance. Don't ask for a property address.
    after_hours: Take a message for the billing queue; Finance calls back next business day.
  - id: other
    label: Anything else
    caller_need: Other
    department: null
    required_fields: [full_name, phone]
    in_hours: Answer from the knowledge base if you can; otherwise capture details for a call-back.
    after_hours: Capture details for a call-back.

alerts:
  sms_mode: push                 # test | push | live. live is not used (see README: US A2P 10DLC)
  dispatch_sms_group: ["+13125550101", "+13125550102"]   # synthetic 555-01xx numbers
  twilio_test_from: "+15005550006"                       # Twilio's magic test sender
  push: { provider: ntfy, topic_env: NTFY_TOPIC, emergency_always: true }

crm:
  type: hubspot
  lead_source: Ella AI receptionist
  # Where each outcome lands in HubSpot. "billing_queue" is a ticket, as the free tier has no task queues worth relying on.
  billing_queue: ticket
  follow_up: task
  emergency: task_high_priority

calendar:
  provider: cal_com
  event_type_id_env: CALCOM_EVENT_TYPE_ID
  lookahead_days: 7
  slots_to_offer: 2

kb:
  path: kb/jrco
  mode: prompt                   # prompt (inlined into the system prompt) | vapi (Vapi knowledge base files)

policies:
  # Spec wording, verbatim.
  pricing: "Every roof is unique based on pitch, size, and materials. We provide free, zero-obligation inspections so we can give you an accurate quote."
  brevity: { max_words: 25, max_sentences: 3, exception: multi-step process explanations }
  empathy:
    in_hours: "I'm so sorry to hear that. Let's get someone out to help secure your property right away."   # spec example
    after_hours: "I'm so sorry to hear that. Let me get our on-call team on this right now."              # spec line overpromises after hours
  safety_line: "If anything could come down, or you see sparks or smell gas, get everyone out and call 911 first."
  consent:
    recording: "This call may be recorded for quality."
    sms_opt_in: "Is it okay if we text updates about this to the number you're calling from?"
  timelines: Only the proposal timeline (typically 24 to 48 hours after the inspection) may be stated. Never promise any other timing.
  non_english: Apologize that you can only help in English right now, try to get a name and phone number, and promise a call-back.
